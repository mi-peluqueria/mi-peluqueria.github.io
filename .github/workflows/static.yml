name: Publicar MI PELUQUERÍA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Preparar la agenda y su icono
        run: |
          mkdir sitio
          cp index.html sitio/index.html
          base64 --decode mi-peluqueria.png.base64 > sitio/mi-peluqueria.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
